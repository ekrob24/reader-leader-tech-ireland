name: Playwright learner safety

on:
  push:
  pull_request:

jobs:
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      E2E_SEED_ORGANISATIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test
      - run: pnpm e2e
